# ============================================
# 论文检索功能 - 配置文件
# 添加到 application.yml 中
# ============================================

# 学术 API 密钥（论文检索功能依赖）
academic:
  # Semantic Scholar API（免费注册: https://api.semanticscholar.org/）
  semantic-scholar:
    api-key: "你的Semantic Scholar API Key"
  # OpenAlex 礼貌池（填入机构邮箱即可）
  openalex:
    email: "your-email@institution.edu"
