# All full-context tests must use an isolated database, regardless of local MySQL settings.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:academy-tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql
ai.openai.api-key=test-key-no-network
spring.ai.openai.api-key=test-key-no-network
jwt.secret=test-only-secret-minimum-thirty-two-characters
weknora.enabled=false
rag.storage-path=${java.io.tmpdir}/ai-academy-tests-native-rag
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# Persistent workers are driven explicitly by tests; no unexpected model calls.
rag.ingestion.worker-enabled=false
