<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Agent 模块全流程简图</title>
  <style>
    html, body {
      margin: 0;
      width: 1800px;
      height: 1100px;
      overflow: hidden;
      background: #f8fafc;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    svg { display: block; }
    .title { font-size: 42px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 20px; fill: #64748b; }
    .section-label { font-size: 20px; font-weight: 700; fill: #475569; }
    .role-title { font-size: 24px; font-weight: 700; }
    .role-copy { font-size: 18px; fill: #334155; }
    .node-title { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .node-copy { font-size: 18px; fill: #475569; }
    .panel-title { font-size: 28px; font-weight: 700; }
    .panel-copy { font-size: 18px; fill: #475569; }
    .edge-label { font-size: 17px; font-weight: 700; fill: #475569; }
    .footer { font-size: 19px; font-weight: 600; fill: #475569; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .arrow-dashed { fill: none; stroke: #d97706; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-amber); }
  </style>
</head>
<body>
<svg width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Agent 模块全流程简图</title>
  <desc id="flow-desc">展示学生、教师、管理员权限，以及普通问答、平台查询、系统写操作三条主流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="90" y="66" class="title">Agent 模块全流程（简版）</text>
  <text x="90" y="103" class="subtitle">当前实现：统一悬浮助手入口，按角色开放聊天、平台查询与待确认写操作</text>

  <text x="90" y="172" class="section-label">角色权限</text>

  <g filter="url(#shadow)">
    <rect x="220" y="125" width="420" height="112" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="270" cy="181" r="27" fill="#0891b2"/>
    <text x="270" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">学</text>
    <text x="315" y="167" class="role-title" fill="#0e7490">学生</text>
    <text x="315" y="198" class="role-copy">普通问答、会话历史、课时选文</text>
    <text x="315" y="224" class="role-copy">不开放平台读写工具</text>

    <rect x="690" y="125" width="420" height="112" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="740" cy="181" r="27" fill="#d97706"/>
    <text x="740" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">师</text>
    <text x="785" y="167" class="role-title" fill="#b45309">教师</text>
    <text x="785" y="198" class="role-copy">聊天 + 本人范围查询与写操作</text>
    <text x="785" y="224" class="role-copy">待确认列表、确认执行、单轮调试</text>

    <rect x="1160" y="125" width="420" height="112" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="1210" cy="181" r="27" fill="#7c3aed"/>
    <text x="1210" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">管</text>
    <text x="1255" y="167" class="role-title" fill="#6d28d9">管理员</text>
    <text x="1255" y="198" class="role-copy">教师能力 + 全局业务权限</text>
    <text x="1255" y="224" class="role-copy">Agent 配置、知识库管理</text>
  </g>

  <text x="90" y="298" class="section-label">共同入口</text>

  <g filter="url(#shadow)">
    <rect x="90" y="320" width="260" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="220" y="362" text-anchor="middle" class="node-title">打开悬浮助手</text>
    <text x="220" y="394" text-anchor="middle" class="node-copy">按钮和窗口均可拖动</text>
    <text x="220" y="420" text-anchor="middle" class="node-copy">保持当前业务页面不变</text>

    <rect x="430" y="320" width="300" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="580" y="362" text-anchor="middle" class="node-title">选择 Agent / 会话</text>
    <text x="580" y="394" text-anchor="middle" class="node-copy">新建、切换、改名、删除</text>
    <text x="580" y="420" text-anchor="middle" class="node-copy">可携带框选课时原文</text>

    <rect x="810" y="320" width="290" height="112" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="955" y="362" text-anchor="middle" class="node-title" fill="#1d4ed8">发送问题</text>
    <text x="955" y="397" text-anchor="middle" class="node-copy">保存用户消息并加载历史</text>
    <text x="955" y="423" text-anchor="middle" class="node-copy">后端校验会话与角色</text>

    <polygon points="1300,305 1435,376 1300,447 1165,376" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="1300" y="367" text-anchor="middle" class="node-title" fill="#4338ca">意图分流</text>
    <text x="1300" y="399" text-anchor="middle" class="node-copy">CHAT / READ / WRITE</text>
  </g>

  <path d="M350 376 H420" class="arrow"/>
  <path d="M730 376 H800" class="arrow"/>
  <path d="M1100 376 H1150" class="arrow"/>

  <path d="M1245 430 C1170 470 780 470 330 505" class="arrow"/>
  <path d="M1300 447 V505" class="arrow"/>
  <path d="M1355 430 C1420 465 1485 470 1485 505" class="arrow"/>
  <text x="720" y="470" class="edge-label">CHAT</text>
  <text x="1315" y="486" class="edge-label">READ</text>
  <text x="1450" y="470" class="edge-label">WRITE</text>

  <g filter="url(#shadow)">
    <rect x="70" y="505" width="500" height="365" rx="28" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
    <rect x="70" y="505" width="500" height="65" rx="28" fill="#cffafe"/>
    <rect x="70" y="545" width="500" height="25" fill="#cffafe"/>
    <text x="320" y="548" text-anchor="middle" class="panel-title" fill="#0e7490">CHAT 普通问答</text>

    <rect x="110" y="600" width="420" height="76" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="320" y="632" text-anchor="middle" class="node-title">组合对话上下文</text>
    <text x="320" y="660" text-anchor="middle" class="panel-copy">历史 + 选文 + 已绑定知识库</text>

    <path d="M320 676 V710" class="arrow"/>
    <rect x="110" y="720" width="420" height="64" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="320" y="760" text-anchor="middle" class="node-title">大模型生成简洁回答</text>

    <path d="M320 784 V808" class="arrow"/>
    <rect x="110" y="815" width="420" height="38" rx="16" fill="#ccfbf1"/>
    <text x="320" y="842" text-anchor="middle" class="footer">显示回复并保存会话</text>

    <rect x="650" y="505" width="500" height="365" rx="28" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="650" y="505" width="500" height="65" rx="28" fill="#e0e7ff"/>
    <rect x="650" y="545" width="500" height="25" fill="#e0e7ff"/>
    <text x="900" y="548" text-anchor="middle" class="panel-title" fill="#4338ca">READ 平台查询</text>

    <rect x="690" y="600" width="420" height="64" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="900" y="640" text-anchor="middle" class="node-title">选择一个已启用读工具</text>
    <path d="M900 664 V698" class="arrow"/>
    <rect x="690" y="708" width="420" height="64" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="900" y="748" text-anchor="middle" class="node-title">查询课程、作业、考试等数据</text>
    <path d="M900 772 V806" class="arrow"/>
    <rect x="690" y="815" width="420" height="38" rx="16" fill="#e0e7ff"/>
    <text x="900" y="842" text-anchor="middle" class="footer">模型整理查询结果并回复</text>

    <rect x="1230" y="505" width="500" height="490" rx="28" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <rect x="1230" y="505" width="500" height="65" rx="28" fill="#fef3c7"/>
    <rect x="1230" y="545" width="500" height="25" fill="#fef3c7"/>
    <text x="1480" y="548" text-anchor="middle" class="panel-title" fill="#b45309">WRITE 系统操作</text>

    <rect x="1270" y="595" width="420" height="64" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="1480" y="635" text-anchor="middle" class="node-title">参数规划与 Schema 校验</text>
    <path d="M1480 659 V674" class="arrow"/>
    <polygon points="1480,674 1570,720 1480,766 1390,720" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1480" y="714" text-anchor="middle" class="node-title">参数完整？</text>
    <text x="1480" y="740" text-anchor="middle" class="panel-copy">必填项与类型合法</text>

    <path d="M1390 720 H1320 V786" class="arrow-dashed"/>
    <text x="1330" y="705" class="edge-label">否</text>
    <rect x="1250" y="792" width="210" height="62" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="1355" y="817" text-anchor="middle" class="node-title">请补充信息</text>
    <text x="1355" y="843" text-anchor="middle" class="panel-copy">保存草稿后继续</text>
    <path d="M1250 823 H1200 V627 H1260" class="arrow-dashed"/>

    <path d="M1570 720 H1630 V786" class="arrow"/>
    <text x="1595" y="705" class="edge-label">是</text>
    <rect x="1500" y="792" width="200" height="62" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="1600" y="817" text-anchor="middle" class="node-title">生成 pendingAction</text>
    <text x="1600" y="843" text-anchor="middle" class="panel-copy">创建真实 actionId</text>

    <path d="M1600 854 V878 H1480" class="arrow"/>
    <rect x="1325" y="875" width="310" height="50" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1480" y="908" text-anchor="middle" class="node-title">自动弹出确认页</text>
    <path d="M1480 925 V940" class="arrow"/>
    <rect x="1295" y="944" width="370" height="36" rx="16" fill="#d1fae5"/>
    <text x="1480" y="970" text-anchor="middle" class="footer" fill="#047857">用户确认 → 执行 → 审计 → 完成</text>
  </g>

  <rect x="90" y="1025" width="1620" height="48" rx="18" fill="#e2e8f0"/>
  <text x="900" y="1057" text-anchor="middle" class="footer">所有写操作都需教师/管理员确认；高风险动作还需精确确认文本。关闭确认页不会删除待确认动作。</text>
</svg>
</body>
</html>
