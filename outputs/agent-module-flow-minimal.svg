<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Agent 模块全流程简图</title>
  <desc id="desc">以简约风格展示学生、教师、管理员角色，以及普通问答、平台查询、系统写操作三条流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 16px; fill: #64748b; }
      .role { font-size: 21px; font-weight: 600; }
      .role-copy { font-size: 15px; fill: #475569; }
      .node-title { font-size: 20px; font-weight: 600; }
      .node-copy { font-size: 15px; fill: #64748b; }
      .lane-title { font-size: 22px; font-weight: 600; }
      .small { font-size: 14px; fill: #64748b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#ffffff"/>
  <text x="50" y="53" class="title">Agent 模块全流程</text>
  <text x="50" y="82" class="sub">悬浮助手 · 角色权限 · CHAT / READ / WRITE</text>

  <!-- Roles -->
  <text x="50" y="134" class="sub">角色权限</text>
  <g>
    <rect x="150" y="105" width="340" height="78" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="175" y="137" class="role" fill="#0f766e">学生</text>
    <text x="175" y="163" class="role-copy">普通问答、会话历史、课时选文</text>

    <rect x="530" y="105" width="340" height="78" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="555" y="137" class="role" fill="#b45309">教师</text>
    <text x="555" y="163" class="role-copy">聊天 + 本人范围查询、写操作与确认</text>

    <rect x="910" y="105" width="340" height="78" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="935" y="137" class="role" fill="#6d28d9">管理员</text>
    <text x="935" y="163" class="role-copy">教师能力 + 全局权限 + Agent / 知识库管理</text>
  </g>

  <!-- Common flow -->
  <rect x="50" y="230" width="230" height="76" rx="14" class="box"/>
  <text x="165" y="263" text-anchor="middle" class="node-title">打开悬浮助手</text>
  <text x="165" y="288" text-anchor="middle" class="node-copy">保持当前业务页面</text>

  <rect x="350" y="230" width="270" height="76" rx="14" class="box"/>
  <text x="485" y="263" text-anchor="middle" class="node-title">问题 + 可选课时原文</text>
  <text x="485" y="288" text-anchor="middle" class="node-copy">选择 Agent 与个人会话</text>

  <polygon points="800,207 900,268 800,329 700,268" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="800" y="262" text-anchor="middle" class="node-title" fill="#1d4ed8">意图分流</text>
  <text x="800" y="286" text-anchor="middle" class="node-copy">CHAT / READ / WRITE</text>

  <path d="M280 268H340" class="edge"/>
  <path d="M620 268H690" class="edge"/>

  <!-- Branch connectors -->
  <path d="M750 314C650 350 380 345 235 385" class="edge"/>
  <path d="M800 329V385" class="edge"/>
  <path d="M850 314C955 348 1110 350 1160 385" class="edge"/>
  <text x="490" y="352" class="small">CHAT</text>
  <text x="815" y="360" class="small">READ</text>
  <text x="1012" y="352" class="small">WRITE</text>

  <!-- Chat lane -->
  <g>
    <rect x="50" y="385" width="370" height="300" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="235" y="425" text-anchor="middle" class="lane-title" fill="#0f766e">CHAT 普通问答</text>
    <line x1="80" y1="445" x2="390" y2="445" stroke="#ccfbf1" stroke-width="2"/>

    <rect x="85" y="470" width="300" height="60" rx="12" class="soft"/>
    <text x="235" y="496" text-anchor="middle" class="node-title">组合对话上下文</text>
    <text x="235" y="518" text-anchor="middle" class="node-copy">历史、选文、已绑定知识库</text>
    <path d="M235 530V558" class="edge"/>
    <rect x="85" y="565" width="300" height="54" rx="12" class="soft"/>
    <text x="235" y="599" text-anchor="middle" class="node-title">大模型生成回答</text>
    <path d="M235 619V642" class="edge"/>
    <text x="235" y="668" text-anchor="middle" class="node-copy">显示回复并保存会话 · 学生仅走此分支</text>
  </g>

  <!-- Read lane -->
  <g>
    <rect x="515" y="385" width="370" height="300" rx="18" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <text x="700" y="425" text-anchor="middle" class="lane-title" fill="#4338ca">READ 平台查询</text>
    <line x1="545" y1="445" x2="855" y2="445" stroke="#e0e7ff" stroke-width="2"/>

    <rect x="550" y="470" width="300" height="54" rx="12" class="soft"/>
    <text x="700" y="504" text-anchor="middle" class="node-title">选择一个已启用读工具</text>
    <path d="M700 524V550" class="edge"/>
    <rect x="550" y="557" width="300" height="54" rx="12" class="soft"/>
    <text x="700" y="591" text-anchor="middle" class="node-title">查询平台业务数据</text>
    <path d="M700 611V637" class="edge"/>
    <text x="700" y="668" text-anchor="middle" class="node-copy">模型整理查询结果并回复</text>
  </g>

  <!-- Write lane -->
  <g>
    <rect x="980" y="385" width="370" height="405" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="1165" y="425" text-anchor="middle" class="lane-title" fill="#b45309">WRITE 系统操作</text>
    <line x1="1010" y1="445" x2="1320" y2="445" stroke="#fef3c7" stroke-width="2"/>

    <rect x="1015" y="465" width="300" height="50" rx="12" class="soft"/>
    <text x="1165" y="497" text-anchor="middle" class="node-title">参数规划与 Schema 校验</text>
    <path d="M1165 515V535" class="edge"/>

    <polygon points="1165,535 1240,575 1165,615 1090,575" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="1165" y="570" text-anchor="middle" class="node-title">参数完整？</text>
    <text x="1165" y="591" text-anchor="middle" class="small">必填项合法</text>

    <path d="M1090 575H1025V638" class="loop"/>
    <text x="1040" y="560" class="small">否</text>
    <rect x="995" y="645" width="160" height="54" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="1075" y="668" text-anchor="middle" class="node-title">请补充信息</text>
    <text x="1075" y="689" text-anchor="middle" class="small">保存草稿</text>
    <path d="M995 672H955V490H1005" class="loop"/>

    <path d="M1240 575H1285V638" class="edge"/>
    <text x="1255" y="560" class="small">是</text>
    <rect x="1175" y="645" width="160" height="54" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1255" y="668" text-anchor="middle" class="node-title">pendingAction</text>
    <text x="1255" y="689" text-anchor="middle" class="small">真实 actionId</text>

    <path d="M1255 699V718H1165" class="edge"/>
    <rect x="1050" y="720" width="230" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1165" y="751" text-anchor="middle" class="node-title">自动弹确认页 → 执行 → 审计</text>
  </g>

  <line x1="50" y1="816" x2="1350" y2="816" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="700" y="840" text-anchor="middle" class="small">所有写操作均需教师或管理员确认；高风险动作还需精确确认文本。</text>
</svg>
