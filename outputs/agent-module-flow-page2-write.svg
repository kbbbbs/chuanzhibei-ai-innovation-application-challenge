<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1900" viewBox="0 0 1120 1900" role="img" aria-labelledby="title desc">
  <title id="title">Agent WRITE 动作执行流程</title>
  <desc id="desc">写入请求由大模型规划并进行参数校验。缺少参数时依次保存补参草稿、由用户补参并重新规划；暂不确认时保留待确认动作；执行失败时回滚并返回动作确认页。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .flow-line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .label { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 20px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 18px; fill: #0f172a; text-anchor: middle; }
      .start { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .action { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; }
      .decision { fill: #f8fafc; stroke: #475569; stroke-width: 1.8; }
      .model { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.5; }
      .write { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; }
      .success { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .error { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1120" height="1900" fill="#ffffff"/>

  <!-- 主流程与两个反馈闭环 -->
  <g aria-hidden="true">
    <path class="flow-line" d="M560 100 L560 150"/>
    <path class="flow-line" d="M560 240 L560 300"/>
    <path class="flow-line" d="M560 380 L560 430"/>

    <path class="flow-line" d="M460 520 L380 520 L380 695 L360 695"/>
    <path class="flow-line" d="M220 650 L220 530"/>
    <path class="flow-line" d="M220 440 L220 195 L390 195"/>

    <path class="flow-line" d="M560 610 L560 650"/>
    <path class="flow-line" d="M560 740 L560 800"/>
    <path class="flow-line" d="M560 880 L560 900"/>

    <path class="flow-line" d="M440 1010 L360 1010"/>
    <path class="flow-line" d="M560 1120 L560 1160"/>
    <path class="flow-line" d="M560 1260 L560 1320"/>
    <path class="flow-line" d="M560 1410 L560 1430"/>

    <path class="flow-line" d="M560 1590 L560 1650"/>
    <path class="flow-line" d="M560 1750 L560 1800"/>

    <path class="flow-line" d="M660 1510 L760 1510"/>
    <path class="flow-line" d="M915 1460 L915 840 L690 840"/>
  </g>

  <!-- 节点 -->
  <rect class="start" x="430" y="30" width="260" height="70" rx="35"/>
  <text class="label" x="560" y="55"><tspan x="560">来自第 1 页的 WRITE</tspan><tspan x="560" dy="26">请求</tspan></text>

  <rect class="model" x="390" y="150" width="340" height="90"/>
  <text class="label" x="560" y="181"><tspan x="560">调用大模型识别写入意图</tspan><tspan x="560" dy="28">规划 actionCode 与参数</tspan></text>

  <rect class="action" x="420" y="300" width="280" height="80"/>
  <text class="label" x="560" y="327"><tspan x="560">参数规范化与 Schema</tspan><tspan x="560" dy="28">校验</tspan></text>

  <polygon class="decision" points="560,430 660,520 560,610 460,520"/>
  <text class="label" x="560" y="520">参数完整合法?</text>

  <rect class="action" x="80" y="650" width="280" height="90"/>
  <text class="label" x="220" y="681"><tspan x="220">保存补参草稿</tspan><tspan x="220" dy="28">提示用户补充</tspan></text>

  <rect class="action" x="80" y="440" width="280" height="90"/>
  <text class="label" x="220" y="471"><tspan x="220">用户补充参数</tspan><tspan x="220" dy="28">重新规划</tspan></text>

  <rect class="write" x="410" y="650" width="300" height="90"/>
  <text class="label" x="560" y="681"><tspan x="560">生成真实</tspan><tspan x="560" dy="28">pendingAction</tspan></text>

  <rect class="write" x="430" y="800" width="260" height="80"/>
  <text class="label" x="560" y="840">自动弹出动作确认页</text>

  <polygon class="decision" points="560,900 680,1010 560,1120 440,1010"/>
  <text class="label" x="560" y="990"><tspan x="560">用户编辑 / 修改</tspan><tspan x="560" dy="28">并确认动作?</tspan></text>

  <rect class="start" x="60" y="960" width="300" height="100" rx="50"/>
  <text class="label" x="210" y="990"><tspan x="210">保留待确认动作</tspan><tspan x="210" dy="28">等待再次确认、取消或过期</tspan></text>

  <rect class="write" x="400" y="1160" width="320" height="100"/>
  <text class="label" x="560" y="1190"><tspan x="560">再次校验角色、归属、风险</tspan><tspan x="560" dy="28">及业务规则</tspan></text>

  <rect class="write" x="420" y="1320" width="280" height="90"/>
  <text class="label" x="560" y="1351"><tspan x="560">调用 ActionExecutor</tspan><tspan x="560" dy="28">执行动作</tspan></text>

  <polygon class="decision" points="560,1430 660,1510 560,1590 460,1510"/>
  <text class="label" x="560" y="1510">执行结果</text>

  <rect class="success" x="390" y="1650" width="340" height="100"/>
  <text class="label" x="560" y="1680"><tspan x="560">写入业务数据和审计日志</tspan><tspan x="560" dy="28">删除 pendingAction</tspan></text>

  <rect class="error" x="760" y="1460" width="310" height="100"/>
  <text class="label" x="915" y="1490"><tspan x="915">事务回滚并显示错误</tspan><tspan x="915" dy="28">保留或刷新待确认动作</tspan></text>

  <rect class="start" x="470" y="1800" width="180" height="60" rx="30"/>
  <text class="label" x="560" y="1830">动作完成</text>

  <!-- 分支标签 -->
  <text class="edge-label" x="425" y="610">否</text>
  <text class="edge-label" x="585" y="638">是</text>
  <text class="edge-label" x="400" y="995">暂不确认</text>
  <text class="edge-label" x="610" y="1147">确认动作</text>
  <text class="edge-label" x="590" y="1630">成功</text>
  <text class="edge-label" x="705" y="1495">失败</text>
</svg>
