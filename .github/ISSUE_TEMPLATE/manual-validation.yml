name: K02 / K03 人工验收或缺陷
description: 按协作文档提交真实观察和验收标准差距
title: "[验收] K02/K03-Axx："
body:
  - type: textarea
    id: context
    attributes:
      label: 用户故事、验收编号及版本
      description: 填 K02/K03-Axx、commit、分支、操作系统、JDK/Node；不填写密钥或私人配置。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 输入、操作与期望
      description: 填合法资料的匿名名称/散列/页号、实际操作、对照的验收标准；私人原件通过团队约定私下提供。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果及证据
      description: 填 PASS/FAIL/BLOCKED、actualMode/degradedReason、文档/解析/索引版本、脱敏截图或日志位置。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响、复现次数与建议优先级
      description: 说明对公式/图片/检索/权限的影响，不把推测写成已观察事实。
