builtin_models:
  - id: ai-learning-embedding-default
    type: Embedding
    source: remote
    is_default: true
    name: ${EMBEDDING_MODEL_NAME}
    description: Remote embedding model used by WeKnora as the AI Learning Agent RAG retriever.
    parameters:
      base_url: ${EMBEDDING_BASE_URL}
      api_key: ${EMBEDDING_API_KEY}
      provider: ${EMBEDDING_PROVIDER}
      embedding_parameters:
        dimension: 3072
        truncate_prompt_tokens: 0
